<meta charset="utf-8">
<title>Payment successful · Buinee</title>
<meta name="description" content="Your Buinee payment was confirmed and your plan is active.">
<script>
  (function () {
    try {
      var saved = localStorage.getItem("buinee-theme");
      var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --paper: #f6f4ef; --surface: #ffffff; --line: #dedad0; --line-strong: #c9c4b7;
    --ink: #101619; --ink-2: #3c4750; --ink-3: #6a747c;
    --teal: #0e5d57; --teal-deep: #0a4340; --teal-soft: #dfece9;
    --good: #2c7a51; --good-soft: #dff0e6;
    --radius: 14px;
    --shadow-lg: 0 30px 80px rgba(16,22,25,.16);
    --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0e1315; --surface: #151b1e; --line: #262f33; --line-strong: #354046;
      --ink: #eef1f0; --ink-2: #bcc5c7; --ink-3: #8b9599;
      --teal: #4fb3a6; --teal-deep: #6fcbbd; --teal-soft: #10312e;
      --good: #4bb37c; --good-soft: #12291d;
      --shadow-lg: 0 30px 80px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --paper: #0e1315; --surface: #151b1e; --line: #262f33; --line-strong: #354046;
    --ink: #eef1f0; --ink-2: #bcc5c7; --ink-3: #8b9599;
    --teal: #4fb3a6; --teal-deep: #6fcbbd; --teal-soft: #10312e;
    --good: #4bb37c; --good-soft: #12291d;
    --shadow-lg: 0 30px 80px rgba(0,0,0,.6);
  }
  :root[data-theme="light"] {
    --paper: #f6f4ef; --surface: #ffffff; --line: #dedad0; --line-strong: #c9c4b7;
    --ink: #101619; --ink-2: #3c4750; --ink-3: #6a747c;
    --teal: #0e5d57; --teal-deep: #0a4340; --teal-soft: #dfece9;
    --good: #2c7a51; --good-soft: #dff0e6;
    --shadow-lg: 0 30px 80px rgba(16,22,25,.16);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 20px;
  }
  a { color: inherit; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-bottom: 34px; }
  .brand .mark {
    width: 32px; height: 32px; border-radius: 9px; flex: none; display: grid; place-items: center;
    background: linear-gradient(140deg, var(--teal), var(--teal-deep)); color: #fff;
  }
  .brand .mark svg { width: 17px; height: 17px; }
  .brand .name { font-family: var(--serif); font-size: 20px; font-weight: 600; letter-spacing: -.02em; }

  .card {
    width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 40px 34px 34px;
    text-align: center;
  }
  .icon {
    width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 22px;
    background: var(--good-soft); color: var(--good); display: grid; place-items: center;
  }
  .icon svg { width: 30px; height: 30px; }
  h1 { margin: 0 0 12px; font-family: var(--serif); font-size: 25px; font-weight: 600; letter-spacing: -.02em; }
  p.lede { margin: 0; color: var(--ink-2); font-size: 15px; max-width: 34ch; margin-left: auto; margin-right: auto; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    padding: 12px 20px; border-radius: 10px; font-size: 15px; font-weight: 600;
    text-decoration: none; border: 1px solid transparent; cursor: pointer;
    background: var(--teal); color: #fff; margin-top: 28px; width: 100%;
    transition: background .14s;
  }
  .btn:hover { background: var(--teal-deep); }
  .btn svg { width: 16px; height: 16px; }

  .foot { margin-top: 22px; font-size: 13px; color: var(--ink-3); }
  .foot a { color: var(--teal); font-weight: 600; text-decoration: none; }
</style>

  <span class="name">Buinee</span>
</a>

<div class="card">
  <div class="icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>
  </div>
  <h1>Payment successful</h1>
  <p class="lede">Your plan is active and your workspace is ready. Welcome to Buinee.</p>
  <a class="btn" href="/dashboard">
    Go to your dashboard
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>
  <div class="foot">Questions about your plan? <a href="/contact">Get in touch</a>.</div>
</div>
