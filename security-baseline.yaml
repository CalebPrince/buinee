    - "Landing-page redesign implementation (new /pricing and /case-studies routes, SITE_CONTENT_SCHEMA extension, reference image assets) per DESIGN.md"
    - "Development unlocked; production deployment stays LOCKED until CTL-INFRA-001 and CTL-AUTHZ-001 are implemented and GATE-002/GATE-003 pass"
  expires_at: null
changes: []
